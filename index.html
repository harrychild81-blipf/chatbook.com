<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendChat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <section id="loginScreen" class="screen auth">
    <div class="card">
      <div class="logo">FC</div>
      <h1>FriendChat</h1>
      <p class="muted">Private chat for your friends</p>

      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">

      <button onclick="login()">Log in</button>
      <button class="secondary" onclick="showSignup()">Create account</button>

      <p id="loginStatus" class="status"></p>
    </div>
  </section>


  <section id="signupScreen" class="screen auth hidden">
    <div class="card">
      <div class="logo">FC</div>
      <h1>Create account</h1>

      <input id="signupName" placeholder="Your name">
      <input id="signupEmail" type="email" placeholder="Email">
      <input id="signupPassword" type="password" placeholder="Password (6+ characters)">

      <button onclick="signup()">Create account</button>
      <button class="secondary" onclick="showLogin()">Back to login</button>

      <p id="signupStatus" class="status"></p>
    </div>
  </section>


  <section id="homeScreen" class="screen hidden">

    <header>
      <div>
        <h2>FriendChat</h2>
        <small id="myIdLabel"></small>
      </div>

      <button class="icon" onclick="showAdd()">＋</button>
    </header>


    <div class="profileRow">
      <div id="profileCircle" class="profile">?</div>

      <div>
        <strong id="myName"></strong>
        <div class="muted">
          Your ID: <span id="myId"></span>
        </div>
      </div>

      <button class="small secondary" onclick="logout()">Log out</button>
    </div>


    <input
      id="search"
      class="search"
      placeholder="Search friends..."
      oninput="renderFriends()"
    >

    <div id="friendList" class="friendList"></div>

  </section>


  <section id="addScreen" class="screen hidden">

    <header>
      <button class="back" onclick="showHome()">←</button>
      <h2>Add</h2>
    </header>


    <div class="card wide">

      <div class="tabs">
        <button
          id="friendTab"
          onclick="selectAddType('friend')"
        >
          Add Friend
        </button>

        <button
          id="groupTab"
          class="secondary"
          onclick="selectAddType('group')"
        >
          Join Group
        </button>
      </div>


      <input
        id="addId"
        placeholder="Enter Friend ID"
      >

      <button onclick="addById()">Continue</button>

      <p id="addStatus" class="status"></p>

      <p class="muted smallText">
        Example: FC-ABC123
      </p>

    </div>

  </section>


  <section id="chatScreen" class="screen hidden">

    <header>
      <button class="back" onclick="showHome()">←</button>

      <div>
        <h2 id="chatName">Chat</h2>
        <small id="chatId"></small>
      </div>
    </header>


    <div id="messages" class="messages"></div>


    <div class="composer">

      <input
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <label
        class="mediaButton"
        title="Send photo/video"
      >
        📎

        <input
          id="mediaInput"
          type="file"
          accept="image/*,video/*"
          hidden
          onchange="sendMedia()"
        >
      </label>

      <button onclick="sendMessage()">Send</button>

    </div>

  </section>

</div>


<!-- Message reaction / action menu -->

<div id="messageMenu" class="messageMenu hidden">

  <div class="messageSheet">

    <strong>React to message</strong>

    <input
      id="selectedMessageId"
      type="hidden"
    >


    <div class="reactionRow">

      <button onclick="reactToMessage('👍')">👍</button>
      <button onclick="reactToMessage('❤️')">❤️</button>
      <button onclick="reactToMessage('😂')">😂</button>
      <button onclick="reactToMessage('😮')">😮</button>
      <button onclick="reactToMessage('😢')">😢</button>
      <button onclick="reactToMessage('😡')">😡</button>

    </div>


    <button
      class="menuAction"
      onclick="unsendMessage()"
    >
      Unsend
    </button>


    <button
      class="menuAction danger"
      onclick="deleteMessage()"
    >
      Delete
    </button>


    <button
      class="menuAction secondary"
      onclick="closeMessageMenu()"
    >
      Cancel
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
